version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: delphi_db
    environment:
      POSTGRES_USER: delphi
      POSTGRES_PASSWORD: delphi
      POSTGRES_DB: delphi_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U delphi" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: delphi_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: delphi_api
    environment:
      DATABASE_URL: postgresql://delphi:delphi@db:5432/delphi_ai
      REDIS_URL: redis://redis:6379/0
      API_HOST: 0.0.0.0
      API_PORT: 8000
      MODEL_DIR: /app/models
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - ../models:/app/models
      - ../backend:/app/backend
      - ../data_pipeline:/app/data_pipeline
      - ../ml:/app/ml
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload

  discord_bot:
    build:
      context: ..
      dockerfile: infra/Dockerfile.discord
    container_name: delphi_discord
    environment:
      DATABASE_URL: postgresql://delphi:delphi@db:5432/delphi_ai
      API_BASE_URL: http://api:8000
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      LOG_LEVEL: INFO
    volumes:
      - ../discord_bot:/app/discord_bot
      - ../backend:/app/backend
    depends_on:
      - api
    command: python -m discord_bot.bot
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
